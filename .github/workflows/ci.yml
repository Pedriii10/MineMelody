# Compila y corre los tests en cada push y pull request.
# Si algo se rompe, GitHub te avisa (y aparece una ❌ al lado del commit).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload jar
        uses: actions/upload-artifact@v5
        with:
          name: minemelody-jar
          path: build/libs/*.jar
